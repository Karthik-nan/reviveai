services:

  # ============================================================
  # POSTGRESQL + PGVECTOR
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: reviveai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: reviveai
      POSTGRES_USER: reviveai
      POSTGRES_PASSWORD: reviveai
      TZ: UTC

    ports:
      - "5432:5432"

    volumes:
      - reviveai_postgres_data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U reviveai -d reviveai"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ============================================================
  # REDIS
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: reviveai-redis
    restart: unless-stopped

    environment:
      TZ: UTC

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - reviveai_redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  # ============================================================
  # ZOOKEEPER
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: reviveai-zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      TZ: UTC

    ports:
      - "2181:2181"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/2181'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # ============================================================
  # KAFKA
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: reviveai-kafka
    restart: unless-stopped

    depends_on:
      zookeeper:
        condition: service_healthy

    ports:
      - "9092:9092"

    environment:

      # --------------------------------------------------------
      # Broker
      # --------------------------------------------------------
      KAFKA_BROKER_ID: 1

      # --------------------------------------------------------
      # Zookeeper
      # --------------------------------------------------------
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # --------------------------------------------------------
      # Listener configuration
      #
      # INTERNAL:
      # Docker containers -> kafka:29092
      #
      # PLAINTEXT:
      # Spring Boot running directly on Windows -> localhost:9092
      # --------------------------------------------------------
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,PLAINTEXT://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,PLAINTEXT://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --------------------------------------------------------
      # Single broker development configuration
      # --------------------------------------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_MIN_INSYNC_REPLICAS: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --------------------------------------------------------
      # Timezone
      # --------------------------------------------------------
      TZ: UTC

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s


# ============================================================
# VOLUMES
# ============================================================
volumes:

  reviveai_postgres_data:
    name: reviveai_reviveai_postgres_data

  reviveai_redis_data:
    name: reviveai_reviveai_redis_data